{% extends "base.html" %}
{% block title %}{{ article.title }} — Thorin Tabor{% endblock %}
{% block content %}

<a href="{{ SITEURL }}/blog/" class="nav-link text-xs font-semibold text-red-900 uppercase tracking-widest">&larr; Back to Blog</a>

<article id="article-card" class="bento-card bg-white border border-slate-200 rounded-2xl p-8 sm:p-10">
  <p class="text-xs text-red-900 mb-2">{{ article.locale_date }}</p>
  <h1 class="font-slab font-bold text-3xl sm:text-4xl tracking-tight text-slate-900 leading-tight mb-6">
    {{ article.title }}
  </h1>
  <div class="article-body prose prose-slate max-w-none prose-headings:font-slab">
    {{ article.content }}
  </div>
</article>

{% endblock %}
