<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Thorin Tabor — Staff Software Engineer{% endblock %}</title>

  <meta name="description" content="{% block meta_description %}Thorin Tabor — Staff Software Engineer building agentic AI systems (RAG, MCP, multi-agent pipelines). Open source maintainer of GenePattern and g2nb.{% endblock %}" />

  <!-- Open Graph / Twitter card -->
  <meta property="og:site_name" content="Thorin Tabor" />
  <meta property="og:type" content="{% block og_type %}website{% endblock %}" />
  <link rel="canonical" href="{{ SITEURL }}/{% block canonical_path %}{% endblock %}" />
  <meta property="og:url" content="{{ SITEURL }}/{{ self.canonical_path()|trim }}" />
  <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}" />
  <meta property="og:description" content="{{ self.meta_description()|trim|e }}" />
  <meta property="og:image" content="{% block og_image %}{{ SITEURL }}/images/og-default.png{% endblock %}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ self.og_title()|trim|e }}" />
  <meta name="twitter:description" content="{{ self.meta_description()|trim|e }}" />
  <meta name="twitter:image" content="{{ self.og_image()|trim }}" />
  {% block extra_meta %}{% endblock %}

  <!-- Feeds -->
  <link rel="alternate" type="application/atom+xml" title="Thorin Tabor — Atom Feed" href="{{ SITEURL }}/{{ FEED_ALL_ATOM }}" />
  <link rel="alternate" type="application/rss+xml" title="Thorin Tabor — RSS Feed" href="{{ SITEURL }}/{{ FEED_ALL_RSS }}" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ SITEURL }}/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ SITEURL }}/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="{{ SITEURL }}/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ SITEURL }}/apple-touch-icon.png" />
  <meta name="theme-color" content="#e9edf2" />

  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Roboto+Slab:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/pygments.css" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background-color: #e9edf2; }
    .font-slab { font-family: 'Roboto Slab', Georgia, serif; }
    html { scroll-behavior: smooth; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .bento-card {
      opacity: 0;
      animation: fadeInUp 0.6s ease forwards;
    }
    /* Hero */
    #hero-card { animation-delay: 0.05s; }
    /* About */
    #about-card { animation-delay: 0.12s; }
    /* Experience cards */
    .exp-card:nth-child(1) { animation-delay: 0.10s; }
    .exp-card:nth-child(2) { animation-delay: 0.18s; }
    .exp-card:nth-child(3) { animation-delay: 0.26s; }
    .exp-card:nth-child(4) { animation-delay: 0.34s; }
    .exp-card:nth-child(5) { animation-delay: 0.42s; }
    /* Education */
    .edu-card:nth-child(1) { animation-delay: 0.10s; }
    .edu-card:nth-child(2) { animation-delay: 0.18s; }
    /* Projects */
    .proj-card:nth-child(1) { animation-delay: 0.10s; }
    .proj-card:nth-child(2) { animation-delay: 0.18s; }
    /* Skills / Publications */
    #skills-card { animation-delay: 0.10s; }
    #pubs-card   { animation-delay: 0.10s; }
    /* Blog cards */
    .post-card:nth-child(1) { animation-delay: 0.10s; }
    .post-card:nth-child(2) { animation-delay: 0.16s; }
    .post-card:nth-child(3) { animation-delay: 0.22s; }
    .post-card:nth-child(4) { animation-delay: 0.28s; }
    .post-card:nth-child(5) { animation-delay: 0.34s; }

    /* Nav underline effect */
    .nav-link { position: relative; }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0;
      width: 0; height: 1px;
      background: #7f1d1d;
      transition: width 0.25s ease;
    }
    .nav-link:hover::after { width: 100%; }

    /* Header nav links: taller tap targets (WCAG 2.2 target size), with the
       underline pinned under the text rather than the padding box. */
    .nav-bar-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 0.875rem 0;
    }
    .nav-bar-link::after {
      content: '';
      position: absolute;
      bottom: 0.75rem; left: 0;
      width: 0; height: 1px;
      background: #7f1d1d;
      transition: width 0.25s ease;
    }
    .nav-bar-link:hover::after { width: 100%; }

    /* Pill hover */
    .skill-pill:hover {
      background-color: #fff1f2;
      border-color: #fecaca;
      color: #7f1d1d;
      transition: all 0.2s ease;
    }
    /* Offset anchors for sticky nav */
    section[id] { scroll-margin-top: 4.5rem; }

    /* Article body typography */
    .article-body a { color: #7f1d1d; text-decoration: none; }
    .article-body a:hover { text-decoration: underline; }
    .article-body h1, .article-body h2, .article-body h3 { font-family: 'Roboto Slab', Georgia, serif; }

    /* Code blocks: fit the pygments.css output into the site's card aesthetic */
    .article-body .highlight {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      overflow-x: auto;
    }
    .article-body .highlight pre {
      background: transparent;
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .article-body :not(pre) > code {
      background: #f1f5f9;
      color: #7f1d1d;
      border-radius: 0.3rem;
      padding: 0.15rem 0.4rem;
      font-size: 0.85em;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="text-slate-900 antialiased">

  <!-- ===================== STICKY NAV ===================== -->
  <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 flex items-center justify-between h-14">
      <!-- Name / logo -->
      <a href="{{ SITEURL }}/" class="font-slab font-semibold text-slate-900 tracking-wide text-sm hover:text-red-900 transition-colors duration-200">
        Thorin Tabor
      </a>
      <!-- Nav links: always visible, including on mobile -->
      <div class="flex items-center gap-5 sm:gap-6 text-[0.7rem] font-semibold text-slate-500 uppercase tracking-widest">
        <a href="{{ SITEURL }}/resume/" class="nav-bar-link hover:text-slate-800 transition-colors duration-200">Resume</a>
        <a href="{{ SITEURL }}/blog/" class="nav-bar-link hover:text-slate-800 transition-colors duration-200">Blog</a>
      </div>
      <!-- Social icons -->
      <div class="flex items-center gap-2.5 sm:gap-3">
        {% include "partials/social_icons.html" %}
      </div>
    </div>
  </nav>

  <!-- ===================== MAIN ===================== -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-12 space-y-6">
    {% block content %}{% endblock %}
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="max-w-5xl mx-auto px-4 sm:px-6 py-10 mt-4 border-t border-slate-200">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-600">
      <span class="font-slab tracking-wide">&copy; {{ current_year }} Thorin Tabor</span>
      <div class="flex flex-wrap items-center justify-center gap-x-5 gap-y-2">
        <a href="mailto:thorin@tmtabor.io"
           class="hover:text-red-900 transition-colors duration-200">thorin@tmtabor.io</a>
        <a href="https://www.linkedin.com/in/tmtabor/" target="_blank" rel="me noopener"
           class="hover:text-red-900 transition-colors duration-200">LinkedIn</a>
        <a href="https://bsky.app/profile/tmtabor.io" target="_blank" rel="me noopener"
           class="hover:text-red-900 transition-colors duration-200">Bluesky</a>
        <a href="https://github.com/tmtabor" target="_blank" rel="me noopener"
           class="hover:text-red-900 transition-colors duration-200">GitHub</a>
        <a href="{{ SITEURL }}/{{ FEED_ALL_RSS }}"
           class="hover:text-red-900 transition-colors duration-200">RSS</a>
      </div>
    </div>
  </footer>

  <!-- Cloudflare Web Analytics -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "3d54771e483f43f4a7e892227eb2a771"}'></script>

</body>
</html>
